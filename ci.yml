name: AIDTIS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.9'
  CUDA_VERSION: '11.8'

jobs:
  # Code quality and linting
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src/ tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/
    
    - name: Type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports

  # Unit tests
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tshark tcpdump
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
        pip install -r requirements.txt
    
    - name: Run safety check
      run: |
        safety check --json --output safety-report.json || true
    
    - name: Run bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  # Docker build and test
  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t aidtis:latest .
    
    - name: Test Docker image
      run: |
        # Test that the image can start
        docker run --rm aidtis:latest python -c "print('Docker image test successful')"
    
    - name: Run container tests
      run: |
        # Start services with docker-compose
        docker-compose up -d
        
        # Wait for services to be ready
        sleep 30
        
        # Test API health
        curl -f http://localhost:8000/health || exit 1
        
        # Clean up
        docker-compose down

  # Model training and validation
  model-training:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download sample datasets
      run: |
        mkdir -p data
        # Note: In a real scenario, you would download actual datasets
        # For CI, we'll create sample data
        python -c "
        import pandas as pd
        import numpy as np
        
        # Create sample data for testing
        n_samples = 1000
        data = {
            'flow_id': range(n_samples),
            'src_ip': [f'192.168.1.{i%254+1}' for i in range(n_samples)],
            'dst_ip': [f'10.0.0.{i%254+1}' for i in range(n_samples)],
            'src_port': np.random.randint(1024, 65535, n_samples),
            'dst_port': np.random.randint(1, 65535, n_samples),
            'protocol': np.random.choice([1, 6, 17], n_samples),
            'duration': np.random.uniform(0.1, 10.0, n_samples),
            'total_bytes': np.random.randint(100, 10000, n_samples),
            'total_packets': np.random.randint(1, 100, n_samples),
            'avg_pkt_size': np.random.uniform(50, 1500, n_samples),
            'pkt_rate': np.random.uniform(1, 100, n_samples),
            'mean_iat': np.random.uniform(0.01, 1.0, n_samples),
            'tcp_flag_counts': ['0,0,0,0,0,0,0,0'] * n_samples,
            'label': np.random.choice(['BENIGN', 'DOS', 'PROBE', 'R2L'], n_samples)
        }
        
        df = pd.DataFrame(data)
        df.to_csv('data/sample_data.csv', index=False)
        print('Sample data created')
        "
    
    - name: Train models
      run: |
        # Create train/val/test splits
        python -c "
        import pandas as pd
        from sklearn.model_selection import train_test_split
        
        df = pd.read_csv('data/sample_data.csv')
        
        # Split data
        train, temp = train_test_split(df, test_size=0.3, random_state=42)
        val, test = train_test_split(temp, test_size=0.5, random_state=42)
        
        train.to_csv('data/train.csv', index=False)
        val.to_csv('data/val.csv', index=False)
        test.to_csv('data/test.csv', index=False)
        
        print('Data splits created')
        "
        
        # Train models
        python src/models/train_model.py data/train.csv data/val.csv data/test.csv models/
    
    - name: Validate model performance
      run: |
        # Check if models were created
        ls -la models/
        
        # Validate model files
        python -c "
        import joblib
        import os
        
        model_files = [f for f in os.listdir('models/') if f.endswith('.joblib')]
        print(f'Found {len(model_files)} model files')
        
        for model_file in model_files:
            try:
                model_data = joblib.load(f'models/{model_file}')
                print(f'✅ {model_file} loaded successfully')
            except Exception as e:
                print(f'❌ {model_file} failed to load: {e}')
                exit(1)
        "
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: models/

  # Performance testing
  performance:
    runs-on: ubuntu-latest
    needs: [docker]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start services
      run: |
        docker-compose up -d
        sleep 30
    
    - name: Run performance tests
      run: |
        python -c "
        import requests
        import time
        import json
        
        # Test API performance
        api_url = 'http://localhost:8000'
        
        # Health check
        start_time = time.time()
        response = requests.get(f'{api_url}/health', timeout=10)
        health_time = time.time() - start_time
        
        print(f'Health check: {health_time:.3f}s')
        
        # Single prediction test
        sample_flow = {
            'src_ip': '192.168.1.100',
            'dst_ip': '10.0.0.1',
            'src_port': 12345,
            'dst_port': 80,
            'protocol': 6,
            'start_time': '2024-01-01T10:00:00',
            'end_time': '2024-01-01T10:00:01',
            'duration': 1.0,
            'total_bytes': 1024,
            'total_packets': 10,
            'avg_pkt_size': 102.4,
            'pkt_rate': 10.0,
            'mean_iat': 0.1,
            'tcp_flag_counts': '0,1,0,0,1,0,0,0'
        }
        
        start_time = time.time()
        response = requests.post(f'{api_url}/predict', 
                               json={'flow': sample_flow}, 
                               timeout=10)
        pred_time = time.time() - start_time
        
        print(f'Single prediction: {pred_time:.3f}s')
        
        # Batch prediction test
        batch_flows = [sample_flow.copy() for _ in range(100)]
        for i, flow in enumerate(batch_flows):
            flow['src_ip'] = f'192.168.1.{100 + i}'
        
        start_time = time.time()
        response = requests.post(f'{api_url}/predict/batch',
                               json={'flows': batch_flows},
                               timeout=60)
        batch_time = time.time() - start_time
        
        print(f'Batch prediction (100 flows): {batch_time:.3f}s')
        print(f'Throughput: {100/batch_time:.1f} flows/second')
        
        # Performance thresholds
        assert health_time < 1.0, f'Health check too slow: {health_time:.3f}s'
        assert pred_time < 2.0, f'Single prediction too slow: {pred_time:.3f}s'
        assert batch_time < 30.0, f'Batch prediction too slow: {batch_time:.3f}s'
        
        print('✅ All performance tests passed')
        "
    
    - name: Clean up
      run: |
        docker-compose down

  # Deployment (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker, model-training, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-models
        path: models/
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # In a real scenario, this would deploy to your staging environment
        # For example: kubectl apply -f k8s/staging/
        echo "✅ Staging deployment completed"
    
    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        # In a real scenario, this would run integration tests against staging
        echo "✅ Integration tests passed"
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # In a real scenario, this would deploy to your production environment
        # For example: kubectl apply -f k8s/production/
        echo "✅ Production deployment completed"
    
    - name: Notify deployment
      run: |
        echo "📢 Deployment notification sent"
        # In a real scenario, this would send notifications to your team
        # For example: Slack, email, or other notification systems

  # Cleanup
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Clean up resources
      run: |
        echo "🧹 Cleaning up CI/CD resources..."
        # Clean up any temporary resources
        echo "✅ Cleanup completed"
